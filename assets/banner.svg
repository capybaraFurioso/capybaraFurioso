<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">Isaac Lira — Software Developer</title>
  <desc id="d">Animated night banner with drifting aurora light, falling snow and a calm ice horizon.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#15243a"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#5eead4" stop-opacity=".55"/>
      <stop offset="0.6" stop-color="#a78bfa" stop-opacity=".45"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
      <animate attributeName="x1" values="-0.6;0.4;-0.6" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.4;1.6;0.4" dur="14s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbeafe" stop-opacity=".95"/>
      <stop offset="1" stop-color="#93c5fd" stop-opacity=".35"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <clipPath id="frame"><rect width="1280" height="400" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="url(#sky)"/>

    <path d="M0 150 C 220 90, 420 210, 640 140 S 1060 90, 1280 160 L1280 240 C 1060 190, 860 280, 640 230 S 220 190, 0 250 Z" fill="url(#aurora)" filter="url(#soft)" opacity=".9">
      <animate attributeName="d" dur="12s" repeatCount="indefinite"
        values="M0 150 C 220 90, 420 210, 640 140 S 1060 90, 1280 160 L1280 240 C 1060 190, 860 280, 640 230 S 220 190, 0 250 Z;
                M0 170 C 220 120, 420 170, 640 120 S 1060 130, 1280 140 L1280 230 C 1060 230, 860 250, 640 210 S 220 230, 0 230 Z;
                M0 150 C 220 90, 420 210, 640 140 S 1060 90, 1280 160 L1280 240 C 1060 190, 860 280, 640 230 S 220 190, 0 250 Z"/>
    </path>

    <g fill="#e2e8f0">
      <circle cx="120" cy="60" r="1.6"><animate attributeName="opacity" values=".3;1;.3" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="310" cy="40" r="1.2"><animate attributeName="opacity" values="1;.2;1" dur="4.2s" repeatCount="indefinite"/></circle>
      <circle cx="540" cy="70" r="1.4"><animate attributeName="opacity" values=".4;1;.4" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="36" r="1.1"><animate attributeName="opacity" values="1;.3;1" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="980" cy="58" r="1.5"><animate attributeName="opacity" values=".2;1;.2" dur="3.3s" repeatCount="indefinite"/></circle>
      <circle cx="1180" cy="44" r="1.2"><animate attributeName="opacity" values="1;.4;1" dur="2.9s" repeatCount="indefinite"/></circle>
    </g>

    <g fill="#f8fafc" opacity=".8">
      <circle cx="200" cy="-10" r="2"><animate attributeName="cy" from="-10" to="410" dur="11s" repeatCount="indefinite"/><animate attributeName="cx" values="200;215;200" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="460" cy="-10" r="1.5"><animate attributeName="cy" from="-10" to="410" dur="13s" begin="2s" repeatCount="indefinite"/><animate attributeName="cx" values="460;445;460" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="-10" r="2.2"><animate attributeName="cy" from="-10" to="410" dur="10s" begin="4s" repeatCount="indefinite"/><animate attributeName="cx" values="700;720;700" dur="4.5s" repeatCount="indefinite"/></circle>
      <circle cx="930" cy="-10" r="1.6"><animate attributeName="cy" from="-10" to="410" dur="12s" begin="1s" repeatCount="indefinite"/><animate attributeName="cx" values="930;915;930" dur="5.5s" repeatCount="indefinite"/></circle>
      <circle cx="1120" cy="-10" r="2"><animate attributeName="cy" from="-10" to="410" dur="14s" begin="6s" repeatCount="indefinite"/><animate attributeName="cx" values="1120;1140;1120" dur="6.5s" repeatCount="indefinite"/></circle>
      <circle cx="80" cy="-10" r="1.4"><animate attributeName="cy" from="-10" to="410" dur="12.5s" begin="3s" repeatCount="indefinite"/><animate attributeName="cx" values="80;95;80" dur="5s" repeatCount="indefinite"/></circle>
    </g>

    <path d="M0 330 L160 318 L300 334 L470 316 L640 332 L820 314 L990 330 L1140 318 L1280 328 L1280 400 L0 400 Z" fill="url(#ice)"/>
    <path d="M0 330 L160 318 L300 334 L470 316 L640 332 L820 314 L990 330 L1140 318 L1280 328" fill="none" stroke="#e0f2fe" stroke-opacity=".7" stroke-width="1.5"/>

    <text x="72" y="132" fill="#5eead4" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="5">CAPYBARAFURIOSO</text>
    <text x="68" y="214" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="72" letter-spacing="-2">Isaac Lira</text>
    <text x="72" y="262" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="24">Software Developer</text>
    <text x="72" y="300" fill="#93c5fd" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="2">WEB · AUTOMATION · GAMES</text>
  </g>
</svg>
